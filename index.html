<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joanna's 30th Birthday — RSVP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Sacramento&display=swap');

  :root {
    --cream: #F4F2E6;
    --card: #FBFAF0;
    --fern: #768E78;
    --fern-deep: #4E6653;
    --fern-muted: #667A69;
    --pistachio: #C6C09C;
    --pistachio-soft: #E9EADD;
    --ink: #2F3A31;
    --ink-dim: #667A69;
    --line: #D8D6BE;
    --sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    padding: 48px 20px 64px;
    position: relative;
    overflow-x: hidden;
  }

  .watermark {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--sans);
    font-size: 340px;
    font-weight: 700;
    color: var(--pistachio);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
    line-height: 1;
    user-select: none;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  .eyebrow {
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fern-deep);
    font-weight: 600;
    margin-bottom: 10px;
  }

  h1 {
    font-family: var(--sans);
    font-weight: 700;
    font-size: clamp(32px, 6.5vw, 46px);
    text-align: center;
    margin: 0 0 6px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .script {
    display: block;
    font-family: 'Sacramento', cursive;
    font-weight: 400;
    font-size: 1.6em;
    color: var(--fern);
    line-height: 1;
    margin-bottom: 2px;
  }

  .subline {
    text-align: center;
    color: var(--ink-dim);
    font-size: 16px;
    margin-bottom: 6px;
  }
  .details {
    text-align: center;
    color: var(--ink-dim);
    font-size: 15px;
    margin-bottom: 20px;
  }
  .details strong { color: var(--ink); font-weight: 600; }

  .divider {
    width: 64px;
    height: 2px;
    background: var(--fern);
    margin: 0 auto 32px;
    border-radius: 2px;
    opacity: 0.6;
  }

  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 28px 26px 30px;
    box-shadow: 0 20px 46px rgba(47, 58, 49, 0.12);
    border: 1.5px solid var(--fern);
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-dim);
    margin: 18px 0 6px;
  }
  label:first-of-type { margin-top: 0; }

  input[type="text"], textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: #FFFFFF;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--fern);
  }
  textarea { resize: vertical; min-height: 64px; }

  .toggle-row {
    display: flex;
    gap: 10px;
  }
  .toggle-btn {
    flex: 1;
    padding: 12px 10px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .toggle-btn:focus-visible { outline: 2px solid var(--fern); outline-offset: 2px; }
  .toggle-btn.yes.active {
    background: var(--fern);
    border-color: var(--fern);
    color: #FFFFFF;
  }
  .toggle-btn.no.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--cream);
  }

  .name-row {
    display: flex;
    gap: 8px;
  }
  .name-row input { flex: 1; }

  .add-name-btn {
    flex-shrink: 0;
    width: 46px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: #FFFFFF;
    color: var(--fern);
    font-size: 22px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .add-name-btn:hover { border-color: var(--fern); background: var(--pistachio-soft); }
  .add-name-btn:focus-visible { outline: 2px solid var(--fern); outline-offset: 2px; }

  #extra-guests:not(:empty) { margin-top: 8px; }

  .extra-guest-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .extra-guest-row input { flex: 1; }
  .remove-guest-btn {
    flex-shrink: 0;
    width: 38px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: #FFFFFF;
    color: var(--ink-dim);
    font-size: 16px;
    cursor: pointer;
  }
  .remove-guest-btn:hover { color: var(--fern); border-color: var(--fern); }

  .submit-btn {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--fern);
    color: #FFFFFF;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .submit-btn:hover { background: var(--fern-deep); }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .submit-btn:focus-visible { outline: 2px solid var(--fern-deep); outline-offset: 2px; }

  .status-msg {
    text-align: center;
    font-size: 14px;
    margin-top: 12px;
    min-height: 18px;
    color: var(--fern-deep);
  }

  .cal-links { text-align: center; margin-top: 6px; }
  .cal-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--fern-deep);
    margin-bottom: 10px;
  }
  .cal-btns { display: flex; gap: 8px; justify-content: center; }
  .cal-btn {
    flex: 1;
    max-width: 170px;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1.5px solid var(--fern);
    background: var(--pistachio-soft);
    color: var(--fern-deep);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .cal-btn:hover { background: var(--fern); color: #FFFFFF; }
  .cal-btn:focus-visible { outline: 2px solid var(--fern-deep); outline-offset: 2px; }

  .tally { margin-top: 40px; text-align: center; }
  .tally-label {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .dots {
    display: flex;
    justify-content: center;
    gap: 7px;
    flex-wrap: wrap;
    min-height: 14px;
    align-items: center;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--fern); }
  .dot:nth-child(3n) { background: var(--fern-deep); }
  .dot:nth-child(4n) { background: var(--pistachio); border: 1px solid var(--fern); }

  .guest-list { margin-top: 36px; }
  .guest-list h2 {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    text-align: center;
    margin-bottom: 14px;
  }
  .guest-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--pistachio-soft);
    margin-bottom: 6px;
    font-size: 14px;
  }
  .guest-name { font-weight: 500; }
  .guest-status {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .guest-status.yes { background: rgba(118,142,120,0.22); color: var(--fern-deep); }
  .guest-status.no { background: rgba(47,58,49,0.10); color: var(--ink-dim); }
  .guest-note {
    font-size: 12px;
    color: var(--ink-dim);
    width: 100%;
    margin-top: 2px;
    font-style: italic;
  }
  .empty-state {
    text-align: center;
    color: var(--ink-dim);
    font-size: 14px;
    padding: 20px 0;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="watermark">30</div>
  <div class="wrap">
    <div class="eyebrow">You're invited to</div>
    <h1><span class="script">Joanna's</span><span> 30th Birthday</span></h1>
    <div class="details"><strong>Saturday, 3 October 2026</strong> · 7:00pm · 38 Landscape Drive, Hillside, 3037</div>
    <div class="divider"></div>

    <div class="card">
      <label for="rsvp-name">Name(s)</label>
      <div class="name-row">
        <input type="text" id="rsvp-name" placeholder="Guest name" autocomplete="name" />
        <button type="button" class="add-name-btn" id="add-guest-btn" aria-label="Add another person" title="Add another person">+</button>
      </div>
      <div id="extra-guests"></div>

      <label>Will you be there?</label>
      <div class="toggle-row" role="group" aria-label="Attending">
        <button type="button" class="toggle-btn yes" id="btn-yes">Yes, can't wait</button>
        <button type="button" class="toggle-btn no" id="btn-no">Can't make it</button>
      </div>

      <label for="rsvp-note">Message for the host (optional)</label>
      <textarea id="rsvp-note" placeholder="Can't wait! / Any allergies to flag, song requests, etc."></textarea>

      <button class="submit-btn" id="submit-btn">Send RSVP</button>
      <div class="status-msg" id="status-msg"></div>

      <div class="cal-links" id="cal-links" hidden>
        <span class="cal-label">Add it to your calendar</span>
        <div class="cal-btns">
          <a class="cal-btn" id="cal-google" target="_blank" rel="noopener">Google Calendar</a>
          <a class="cal-btn" id="cal-ics" download="joannas-30th-birthday.ics">Apple / Outlook</a>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  // ---- FILL THESE IN from your Supabase project (Settings > API) ----
  const SUPABASE_URL = "https://fedxfcikyeeyrmrtnufk.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_1NLaZny-DdtbdqLMLVwb6g_35pzFEdJ";
  // ----------------------------------------------------------------

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let attending = null;

  const btnYes = document.getElementById('btn-yes');
  const btnNo = document.getElementById('btn-no');
  const extraGuestsEl = document.getElementById('extra-guests');
  const addGuestBtn = document.getElementById('add-guest-btn');
  let extraGuestId = 0;

  function renumberGuests() {
    extraGuestsEl.querySelectorAll('.extra-guest-row input')
      .forEach((input, i) => { input.placeholder = 'Guest name ' + (i + 2); });
  }

  function addGuestRow() {
    const id = 'extra-guest-' + (extraGuestId++);
    const row = document.createElement('div');
    row.className = 'extra-guest-row';
    row.innerHTML = `
      <input type="text" id="${id}" />
      <button type="button" class="remove-guest-btn" aria-label="Remove this guest">×</button>
    `;
    row.querySelector('.remove-guest-btn').addEventListener('click', () => {
      row.remove();
      renumberGuests();
    });
    extraGuestsEl.appendChild(row);
    renumberGuests();
    row.querySelector('input').focus();
  }
  addGuestBtn.addEventListener('click', addGuestRow);

  btnYes.addEventListener('click', () => {
    attending = true;
    btnYes.classList.add('active');
    btnNo.classList.remove('active');
  });
  btnNo.addEventListener('click', () => {
    attending = false;
    btnNo.classList.add('active');
    btnYes.classList.remove('active');
  });

  const submitBtn = document.getElementById('submit-btn');
  const statusMsg = document.getElementById('status-msg');

  // ---- Add to calendar (Sat 3 Oct 2026, 7:00pm–midnight AEST = 09:00–14:00 UTC) ----
  const EVENT = {
    title: "Joanna's 30th Birthday",
    location: "38 Landscape Drive, Hillside, VIC 3037",
    details: "Join us to celebrate Joanna's 30th! Dress code: casual.",
    startUTC: "20261003T090000Z",
    endUTC: "20261003T140000Z"
  };
  const calLinks = document.getElementById('cal-links');
  const gcalUrl = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(EVENT.title)
    + "&dates=" + EVENT.startUTC + "/" + EVENT.endUTC
    + "&location=" + encodeURIComponent(EVENT.location)
    + "&details=" + encodeURIComponent(EVENT.details);
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Joannas 30th//RSVP//EN", "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT", "UID:joannas-30th-20261003@rsvp", "DTSTAMP:20260101T000000Z",
    "DTSTART:" + EVENT.startUTC, "DTEND:" + EVENT.endUTC,
    "SUMMARY:" + EVENT.title, "LOCATION:" + EVENT.location, "DESCRIPTION:" + EVENT.details,
    "END:VEVENT", "END:VCALENDAR"
  ].join("\r\n");
  document.getElementById('cal-google').href = gcalUrl;
  document.getElementById('cal-ics').href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);

  submitBtn.addEventListener('click', async () => {
    const name = document.getElementById('rsvp-name').value.trim();
    const note = document.getElementById('rsvp-note').value.trim();
    const guests = Array.from(extraGuestsEl.querySelectorAll('input'))
      .map(i => i.value.trim())
      .filter(Boolean);

    if (!name) {
      statusMsg.textContent = "Please add your name.";
      return;
    }
    if (attending === null) {
      statusMsg.textContent = "Let us know if you're coming!";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    const { error } = await supabase
      .from('rsvps')
      .insert([{ name, attending, guests, note: note || null }]);

    if (error) {
      console.error(error);
      statusMsg.textContent = "Something went wrong — please try again.";
    } else {
      statusMsg.textContent = "Thanks — your RSVP is in!";
      calLinks.hidden = !attending;
      document.getElementById('rsvp-name').value = '';
      document.getElementById('rsvp-note').value = '';
      extraGuestsEl.innerHTML = '';
      attending = null;
      btnYes.classList.remove('active');
      btnNo.classList.remove('active');
    }

    submitBtn.disabled = false;
    submitBtn.textContent = "Send RSVP";
  });
})();
</script>
</body>
</html>
